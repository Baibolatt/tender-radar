<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Заказы флориста</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/panel.css">
  <script src="/static/panel.js" defer></script>
</head>
<body>
  <div class="boot" id="boot">Загрузка…</div>

  <!-- Экран входа: показывается, если сессии нет. -->
  <section class="login" id="login" hidden>
    <div class="login__card">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true"></div>
        <div>
          <div class="brand__name">Гүл</div>
          <div class="brand__sub">вход в панель</div>
        </div>
      </div>
      <form class="login__form" id="login-form" novalidate>
        <label class="login__label" for="password">Пароль</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
        <p class="login__error" id="login-error" role="alert" hidden></p>
        <button class="btn btn--primary login__submit" type="submit">Войти</button>
      </form>
    </div>
  </section>

  <!-- Панель заказов: скрыта, пока не вошли. -->
  <div class="wrap" id="app" hidden>
    <header class="top">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true"></div>
        <div>
          <div class="brand__name">Гүл</div>
          <div class="brand__sub">заказы · Тараз</div>
        </div>
      </div>
      <div class="top__right">
        <span class="badge" id="new-badge"><b id="new-count">0</b> <span id="new-word">новых</span></span>
        <button class="pill sound" id="sound-toggle" type="button"
                aria-pressed="false" aria-label="Звук выключен" title="Звук">
          <span class="pill__dot"></span><span id="sound-label">Звук</span>
        </button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="search" type="search" placeholder="Поиск по имени или телефону" aria-label="Поиск по имени или телефону">
      </div>
      <div class="filters" id="filters" role="group" aria-label="Фильтр по статусу"></div>
    </div>

    <main class="feed" id="feed" aria-live="polite"></main>
    <p class="empty" id="empty" hidden>Заказов пока нет</p>
  </div>

  <div class="toast" id="toast" role="status" hidden>
    <span class="toast__dot"></span>
    <div id="toast-text"></div>
  </div>
</body>
</html>
